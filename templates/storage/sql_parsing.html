<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL & JSON Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .editor-container {
            position: relative;
            width: 48%;
        }

        .CodeMirror {
            height: 400px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .actions {
            margin: 20px;
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px 20px;
            margin: 0 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        .message {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>
<body>
    <div class="actions">
        <button id="uploadSQLButton">Upload SQL File</button>
        <button id="parseSQLButton">Parse SQL to JSON</button>
        <button id="uploadJSONButton">Upload JSON</button>
    </div>

    <div class="container">
        <div class="editor-container">
            <textarea id="sqlEditor" placeholder="SQL content here..."></textarea>
        </div>
        <div class="editor-container">
            <textarea id="jsonEditor" placeholder="JSON content here..."></textarea>
        </div>
    </div>

    <p id="message" class="message"></p>

    <input type="file" id="fileInput" accept=".sql" style="display: none;">

    <script>
        // Initialize CodeMirror for SQL editor
        const sqlTextArea = document.getElementById('sqlEditor');
        const jsonTextArea = document.getElementById('jsonEditor');

        const sqlEditor = CodeMirror.fromTextArea(sqlTextArea, {
            mode: 'text/x-sql',
            lineNumbers: true,
            theme: 'default',
            indentWithTabs: true,
            smartIndent: true,
            matchBrackets: true,
            autofocus: true
        });

        // Initialize CodeMirror for JSON editor
        const jsonEditor = CodeMirror.fromTextArea(jsonTextArea, {
            mode: 'application/json',
            lineNumbers: true,
            theme: 'default',
            indentWithTabs: true,
            smartIndent: true,
            matchBrackets: true,
            autofocus: false
        });

        const message = document.getElementById('message');
        const fileInput = document.getElementById('fileInput');

        // Handle SQL File Upload
        document.getElementById('uploadSQLButton').addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    sqlEditor.setValue(e.target.result);
                };
                reader.readAsText(file);
            }
        });

        // Parse SQL to JSON
        document.getElementById('parseSQLButton').addEventListener('click', async () => {
            const sqlContent = sqlEditor.getValue();

            try {
                const response = await fetch('/storage/parse_sql_to_json/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sql: sqlContent })
                });

                if (!response.ok) {
                    throw new Error('Failed to parse SQL.');
                }

                const data = await response.json();
                jsonEditor.setValue(JSON.stringify(data, null, 2));
                message.textContent = 'SQL parsed successfully!';
            } catch (error) {
                message.textContent = error.message;
                message.style.color = 'red';
            }
        });

        // Upload JSON to Server
        document.getElementById('uploadJSONButton').addEventListener('click', async () => {
            const jsonContent = jsonEditor.getValue();

            try {
                const response = await fetch('/storage/upload_json/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ json: jsonContent })
                });

                if (!response.ok) {
                    throw new Error('Failed to upload JSON.');
                }

                const data = await response.json();
                message.textContent = data.message;
                message.style.color = 'green';
            } catch (error) {
                message.textContent = error.message;
                message.style.color = 'red';
            }
        });
    </script>
</body>
</html>
