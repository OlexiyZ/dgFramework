<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Role Info Fetch</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        .close-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        pre {
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<!-- Modal window -->
<div id="resultModal" class="modal">
    <div class="modal-content">
        <pre id="resultMessage"></pre>
        <button id="closeBtn" class="close-btn">OK</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const authToken = "Bearer {{ auth_token }}";
    const proxyHost = "{{ proxy_host }}";
    const role_id = "{{ role_id }}";

    const myHeaders = new Headers();
    myHeaders.append("Content-Type", "application/json");
    myHeaders.append("Authorization", authToken);

    const graphql = JSON.stringify({
        query: `
            query GetRole($getRoleId: String!) {
                getRole(id: $getRoleId) {
                    name
                    attrs
                    id
                }
            }
        `,
        variables: {
            getRoleId: role_id
        }
    });

    const requestOptions = {
        method: "POST",
        headers: myHeaders,
        body: graphql,
        redirect: "follow"
    };

    function showModal(message) {
        const modal = document.getElementById('resultModal');
        document.getElementById('resultMessage').textContent = message;
        modal.style.display = "block";
    }

    let redirectAfterClose = false;

    fetch(proxyHost, requestOptions)
        .then(function (response) {
            if (response.ok) {
                showModal("Role data received.");
                return response.json();
            } else {
                return response.text().then(text => {
                    showModal(`❌ Error ${response.status}:\n\n${text}`);
                    // Повертаємо rejected promise, щоб зупинити подальше виконання
                    throw new Error(`HTTP ${response.status} - ${text}`);
                });
            }
        })
        .then(function (data) {
            const role = data.data?.getRole;
            if (role) {
                const formatted = JSON.stringify(role, null, 2);
                showModal("✔️ Successfully received role:\n\n" + formatted);
            } else {
                showModal("⚠️ No role data received.");
            }
            redirectAfterClose = true;
        })
        .catch(function (error) {
            showModal("❌ Error occurred:\n\n" + error.toString());
            redirectAfterClose = true;
        });

    document.getElementById('closeBtn').addEventListener("click", function () {
        if (redirectAfterClose) {
            window.location.href = "/storage/role/";
        }
    });
});
</script>

</body>
</html>
