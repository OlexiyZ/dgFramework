<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запуск звіту</title>
    <style>
      /* Styles for a simple modal window */
      .modal {
          display: none; /* Hidden by default */
          position: fixed;
          z-index: 1;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: auto;
          background-color: rgba(0,0,0,0.4); /* Black background with transparency */
      }
      .modal-content {
          background-color: #fefefe;
          margin: 15% auto;
          padding: 20px;
          border: 1px solid #888;
          width: 80%;
          max-width: 500px;
          text-align: center;
          white-space: pre-wrap; /* Allow line breaks in error details */
      }
      .close-btn {
          background-color: #4CAF50;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
      }
    </style>
</head>
<body>

<!-- Modal window -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <p id="resultMessage"></p>
    <button id="closeBtn" class="close-btn">OK</button>
  </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function(){
        // Function to show a modal window with a message
        function showModal(message) {
            var modal = document.getElementById('resultModal');
            document.getElementById('resultMessage').textContent = message;
            modal.style.display = "block";
        }

        // Retrieving header values from Django backend
        const authToken = "Bearer {{ auth_token }}"; // passed from Django backend
        const proxyHost = "{{ proxy_host }}";
        console.log(authToken);
        console.log(proxyHost);

        const myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        myHeaders.append("Authorization", authToken);

        const graphql = JSON.stringify({
            query: "query GetRoles($filter: RoleFilterInput, $pagination: ConnectionArgs) {\n" +
                "  getRoles(filter: $filter, pagination: $pagination) {\n" +
                "    edges {\n" +
                "      node {\n" +
                "        id\n" +
                "        name\n" +
                "      }\n" +
                "    }\n" +
                "  }\n" +
                "}",
            variables: {}
        });
        const requestOptions = {
        method: "POST",
        headers: myHeaders,
        body: graphql,
        redirect: "follow"
        };
        // Performing the GraphQL request
        fetch(proxyHost, requestOptions)
        .then(function(response) {
            if (response.ok) {
                return response.json(); // Assume the response is in JSON format
            } else {
                throw new Error("An error occurred while executing the request.");
            }
        })
        .then(function(data) {
            // Successful response
            showModal("Request completed successfully.");
            console.log(data); // Logging the received data
            // Sending the received data to the Django backend
            return fetch("/storage/save_roles/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ roles: data.data.getRoles.edges })
            });
        })
        .then(function(response) {
            if (response.ok) {
                console.log("Roles successfully saved to the backend.");
            } else {
                throw new Error("Error saving roles to the backend.");
            }
        })
        .catch(function(error) {
            // Error during request execution
            console.error("Full error:", error);
            showModal("Error: " + (error.stack || error.toString()));
        });

        // Click handler for the button in the modal window
        document.getElementById('closeBtn').addEventListener("click", function(){
            window.location.href = "/storage/role/";
        });
    });
</script>
</body>
</html>
