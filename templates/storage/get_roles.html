<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запуск звіту</title>
    <style>
      /* Стилі для простого модального вікна */
      .modal {
          display: none; /* Приховано за замовчуванням */
          position: fixed;
          z-index: 1;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: auto;
          background-color: rgba(0,0,0,0.4); /* Чорний фон з прозорістю */
      }
      .modal-content {
          background-color: #fefefe;
          margin: 15% auto;
          padding: 20px;
          border: 1px solid #888;
          width: 80%;
          max-width: 500px;
          text-align: center;
      }
      .close-btn {
          background-color: #4CAF50;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
      }
    </style>
</head>
<body>

<!-- Модальне вікно -->
<div id="resultModal" class="modal">
  <div class="modal-content">
    <p id="resultMessage"></p>
    <button id="closeBtn" class="close-btn">OK</button>
  </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function(){
        // Функція для показу модального вікна з повідомленням
        function showModal(message) {
            var modal = document.getElementById('resultModal');
            document.getElementById('resultMessage').textContent = message;
            modal.style.display = "block";
        }

        // Отримання значень заголовків з Django бекенду
        const authToken = "Bearer {{ auth_token }}"; // передається з Django бекенду
        const proxyHost = "{{ proxy_host }}";
        console.log(authToken);
        console.log(proxyHost);

        const myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        myHeaders.append("Authorization", authToken);

        const graphql = JSON.stringify({
            query: "query GetRoles($filter: RoleFilterInput, $pagination: ConnectionArgs) {\n" +
                "  getRoles(filter: $filter, pagination: $pagination) {\n" +
                "    edges {\n" +
                "      node {\n" +
                "        id\n" +
                "        name\n" +
                "      }\n" +
                "    }\n" +
                "  }\n" +
                "}",
            variables: {}
        });
        const requestOptions = {
        method: "POST",
        headers: myHeaders,
        body: graphql,
        redirect: "follow"
        };
        // Виконання GraphQL запиту
        fetch(proxyHost, requestOptions)
        .then(function(response) {
            if (response.ok) {
                return response.json(); // Припустимо, що відповідь приходить у форматі JSON
            } else {
                throw new Error("Сталася помилка при виконанні запиту.");
            }
        })
        .then(function(data) {
            // Успішна відповідь
            showModal("Запит виконано успішно.");
            console.log(data); // Логування отриманих даних
            // Відправка отриманих даних на бекенд Django
            return fetch("/storage/save_roles/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ roles: data.data.getRoles.edges })
            });
        })
        .then(function(response) {
            if (response.ok) {
                console.log("Ролі успішно збережено на бекенді.");
            } else {
                throw new Error("Помилка при збереженні ролей на бекенді.");
            }
        })
        .catch(function(error) {
            // Помилка при виконанні запиту
            showModal("Помилка: " + error.message);
        });

        // Обробник кліку по кнопці в модальному вікні
        document.getElementById('closeBtn').addEventListener("click", function(){
            window.location.href = "/storage/role/";
        });
    });
</script>
</body>
</html>
