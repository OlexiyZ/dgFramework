<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Management</title>
    <style>
        /* Modal window styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
            border-radius: 10px;
            text-align: center;
        }

        .modal button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal .confirm {
            background-color: #4CAF50;
            color: white;
        }

        .modal .cancel {
            background-color: #f44336;
            color: white;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        function uploadFile() {
            // We get the file from input
            var fileInput = document.getElementById('uploadJSON');
            var file = fileInput.files[0]; // Take the first selected file

            if (!file) {
                alert("Пожалуйста, выберите файл для загрузки.");
                return;
            }

            // Create a FormData object for file transfer
            var formData = new FormData();
            formData.append('dbJson', file);

            // Use the fetch API to send the file to the server
            fetch('/storage/upload_db_json/', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
            shtml = data
            console.log("html", data)
            document.getElementById("importResponseMessage").innerHTML =
                `Message: ${data.message}\nFile Path: ${data.file_path}`;
            })
        }
    </script>
</head>
<body id="content">

<h1>Database Management</h1>
<hr>
<h2>Database export</h2>

    <button id="openModalButton">Download DB Json</button>
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to proceed?</p>
            <button class="confirm" id="confirmButton">Yes</button>
            <button class="cancel" id="cancelButton">No</button>
        </div>
    </div>
    <h3>Export response:</h3>
    <p id="message"></p>

    <script>
        const modal = document.getElementById("confirmationModal");
        const openModalButton = document.getElementById("openModalButton");
        const confirmButton = document.getElementById("confirmButton");
        const cancelButton = document.getElementById("cancelButton");
        const messageElement = document.getElementById("message");
        const downloadUrl = "/storage/download_db_json/";

        // Open a modal window when the button is clicked
        openModalButton.addEventListener("click", () => {
            modal.style.display = "block";
        });

        // Close the modal window without any action
        cancelButton.addEventListener("click", () => {
            modal.style.display = "none";
        });

        // Confirm the action and follow the link
        confirmButton.addEventListener("click", async function()  {
            modal.style.display = "none";
            try {
                // Get the file via fetch
                const response = await fetch(downloadUrl);

                if (!response.ok) {
                    throw new Error("Failed to download file.");
                }

                // Creating a Blob object to store a file
                const blob = await response.blob();

                // Creating a temporary <a> for file upload
                const anchor = document.createElement('a');
                anchor.href = URL.createObjectURL(blob);
                const contentDisposition = response.headers.get('Content-Disposition');
                const fileName = contentDisposition.match(/filename="(.+)"/)[1];
                anchor.download = fileName;
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);

                messageElement.textContent = "File downloaded successfully!";
            } catch (error) {
                messageElement.textContent = "Error: " + error.message;
            }
        });

        // Close the modal window when clicked outside it
        window.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>

<!--<h3>Export response:</h3>-->
<!--    <p id="exportResponseMessage"></p>-->
<hr>
<h2>Database import</h2>

<form id="uploadForm" enctype="multipart/form-data" method="post">
    {% csrf_token %}
    <input type="file" id="uploadJSON" name="uploadJSON" accept=".json" required>
    <button type="button" onclick="uploadFile()">Upload DB Json</button>
</form>

<h3>Import response:</h3>
    <p id="importResponseMessage"></p>

</body>
</html>
