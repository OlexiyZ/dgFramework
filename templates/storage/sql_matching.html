<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SQL query comparison</title>
    {% load static %}

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/eclipse.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/merge/merge.min.css">
    <style>
      body { margin: 20px; }
      .CodeMirror { height: auto; border: 1px solid #ddd; }
    </style>
    <style>
        .query-headers {
          display: flex;
        }

        .query-headers .editor-container {
          flex: 1;
          text-align: center;
        }
    </style>
</head>
<body>
    <h1>SQL query comparison</h1>

    <div class="query-headers">
      <div class="editor-container">
        <p>{{ new_version }}</p>
      </div>
      <div class="editor-container">
        <p>{{ old_version }}</p>
      </div>
    </div>

    <div id="merge-view"></div>

    <script src="{% static 'storage/js/diff_match_patch.js' %}"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
<!--    <script src="{% static 'storage/js/codemirror.min.js' %}"></script>-->
    <!-- SQL Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/sql/sql.min.js"></script>
<!--    <script src="{% static 'storage/js/mode/sql/sql.min.js' %}"></script>-->
    <!-- App MergeView -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/merge/merge.min.js"></script>
<!--    <script src="{% static 'storage/js/addon/merge/merge.min.js' %}"></script>-->

    <script>
        // Initializing MergeView with passed SQL queries from Django context
        var target = document.getElementById("merge-view");
        var mergeView = CodeMirror.MergeView(target, {
            value: `{{ new_query|escapejs }}`,
            orig: `{{ old_query|escapejs }}`,
            lineNumbers: true,
            mode: "text/x-sql",
            theme: "eclipse",
            highlightDifferences: true,
            connect: "align",
            readOnly: true
        });
    </script>
</body>
</html>
